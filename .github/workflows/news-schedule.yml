name: Daily News to Slack

on:
  schedule:
    # 매일 아침 10시 (한국 시간)
    # UTC 기준으로 1시 (KST -9시간)
    - cron: '0 1 * * *'
  
  # 수동 실행 옵션 (테스트용)
  workflow_dispatch:

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      
      - name: Run scraper
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python scraper.py
